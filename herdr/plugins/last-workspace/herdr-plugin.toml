id = "last-workspace"
name = "last-workspace"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Toggle to the previously focused workspace"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["bash", "scripts/last-workspace.sh", "focused"]

[[events]]
on = "workspace.closed"
command = ["bash", "scripts/last-workspace.sh", "closed"]

[[actions]]
id = "toggle"
title = "Last workspace"
contexts = ["global"]
command = ["bash", "scripts/last-workspace.sh", "toggle"]
