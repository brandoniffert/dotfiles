onboarding = false

[theme]
name = "catppuccin"

[theme.custom]
panel_bg = "#1e1e2e"
active_row_bg = "#313244"

[keys]
prefix = "ctrl+space"
settings = "prefix+shift+s"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
detach = "prefix+d"
close_tab = "prefix+q"
close_workspace = "prefix+shift+q"
rename_tab = "prefix+comma"
previous_tab = ["prefix+p", "prefix+left"]
next_tab = ["prefix+n", "prefix+right"]
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"
split_vertical = ["prefix+v", "prefix+="]
split_horizontal = "prefix+minus"
resize_pane_left = "shift+left"
resize_pane_right = "shift+right"
resize_pane_up = "shift+up"
resize_pane_down = "shift+down"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "popups.lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+backtick"
type = "plugin_action"
command = "popups.shell"
description = "shell"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "popups.projects"
description = "project workspace picker"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "popups.extract-words"
description = "extract words/paths/urls"

[[keys.command]]
key = "prefix+slash"
type = "plugin_action"
command = "popups.extract-lines"
description = "search scrollback lines"

[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "send ctrl+l to pane"

[[keys.command]]
key = "prefix+]"
type = "shell"
command = "herdr-resize-right"
description = "right pane 33%"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "last-tab.toggle"
description = "last tab"

[[keys.command]]
key = "prefix+backspace"
type = "plugin_action"
command = "last-workspace.toggle"
description = "last workspace"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "clean-copy.copy"
description = "clean-copy selection"

[ui]
prompt_new_tab_name = false
prompt_new_workspace_name = true
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
pane_borders = "always"
window_title = "{workspace}:{tab}"
tab_bar_right = [{ type = "hostname" }]

[ui.toast]
delivery = "herdr"
